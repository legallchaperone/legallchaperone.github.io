<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Wenxin Chen</title>
  <meta name="description" content="{{ page.description | default: page.title }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="blog-wrap">
    <nav class="blog-nav">
      <a href="/" class="blog-back">← Wenxin Chen</a>
      <span class="blog-nav-sep">/</span>
      <a href="/blog/" class="blog-back">Blog</a>
    </nav>

    <article>
      <h1 class="blog-post-title">{{ page.title }}</h1>
      <p class="blog-post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
      <div class="blog-post-content">
        {{ content }}
      </div>
    </article>

    <footer class="blog-footer">
      <a href="/blog/" class="blog-back">← Back to all posts</a>
    </footer>
  </div>
</body>
</html>
