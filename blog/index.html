<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Wenxin Chen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="blog-wrap">
    <nav class="blog-nav">
      <a href="/" class="blog-back">← Wenxin Chen</a>
    </nav>

    <h1 class="blog-index-title">Blog</h1>
    <p class="blog-index-desc">Notes on research, math, and things I'm learning.</p>

    <ul class="blog-post-list" id="post-list">
      <li style="color:var(--mid-gray);font-family:var(--font-head);font-size:.85rem;padding:.85rem 0">Loading…</li>
    </ul>
  </div>

  <script>
    function fmtDate(str) {
      const d = new Date(str + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    fetch('/blog/posts.json')
      .then(r => r.json())
      .then(posts => {
        const list = document.getElementById('post-list');
        if (!posts.length) {
          list.innerHTML = '<li class="blog-empty">No posts yet — check back soon.</li>';
          return;
        }
        list.innerHTML = posts
          .sort((a, b) => b.date.localeCompare(a.date))
          .map(p => `
            <li class="blog-post-item">
              <a href="/blog/post.html?f=${encodeURIComponent(p.file)}" class="blog-post-link">${p.title}</a>
              <span class="blog-post-date">${fmtDate(p.date)}</span>
            </li>`)
          .join('');
      })
      .catch(() => {
        document.getElementById('post-list').innerHTML =
          '<li class="blog-empty">No posts yet — check back soon.</li>';
      });
  </script>
</body>
</html>
