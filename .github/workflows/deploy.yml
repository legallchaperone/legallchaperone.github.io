name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Stage static site 📁
        run: |
          mkdir _staging
          cp index.html style.css favicon.ico _staging/
          cp -r assets _staging/assets
          cp -r blog _staging/blog

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: _staging

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
